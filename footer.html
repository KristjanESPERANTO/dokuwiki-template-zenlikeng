<?php
$headerPicture = tpl_getConf('headerPicture');
if ($headerPicture !== '') {
    $headerPictureJson = json_encode(
        $headerPicture,
        JSON_HEX_TAG | JSON_HEX_AMP | JSON_HEX_APOS | JSON_HEX_QUOT | JSON_THROW_ON_ERROR
    );

    tpl_inlineScript(
        '(function () {' .
        'const header = document.getElementById("headerpic");' .
        'if (header) header.style.backgroundImage = "url(" + JSON.stringify(' . $headerPictureJson . ') + ")";' .
        '})();'
    );
}
?>
