name: Publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: npm

      - run: npm ci

      - name: Verify tag version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag_version=${RELEASE_TAG#v}
          package_version=$(node -p "require('./package.json').version")
          if [[ "$tag_version" != "$package_version" ]]; then
            printf 'Tag version %s does not match package.json version %s\n' "$tag_version" "$package_version" >&2
            exit 1
          fi

      - name: Build installable ZIP
        run: npm run release:package

      - name: Create GitHub release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/zenlikeng-${RELEASE_TAG}.zip" \
            --title "Zenlike NG ${RELEASE_TAG}" \
            --generate-notes \
            --verify-tag
